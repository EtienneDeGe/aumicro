name: Collecte des invités

on:
  schedule:
    # GitHub retarde ou saute parfois les déclenchements planifiés : on en prévoit beaucoup.
    # Toutes les 20 min de 7h à 11h (heure de Paris en hiver), puis toutes les heures jusqu'à 22h.
    - cron: "3,23,43 6-9 * * *"
    - cron: "13 10-21 * * *"
  workflow_dispatch:
    inputs:
      depuis:
        description: "Date de début (AAAA-MM-JJ), vide = 3 derniers jours"
        required: false
        default: ""
      emission:
        description: "Ne collecter qu'une émission (identifiant), vide = toutes"
        required: false
        default: ""
      essai:
        description: "Essai : afficher sans proposer de modification"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: collecte
  cancel-in-progress: false

jobs:
  collecte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Collecter
        run: |
          ARGS=""
          if [ -n "${{ inputs.depuis }}" ]; then ARGS="--depuis ${{ inputs.depuis }}"; fi
          if [ -n "${{ inputs.emission }}" ]; then ARGS="$ARGS --emission ${{ inputs.emission }}"; fi
          if [ "${{ inputs.essai }}" = "true" ]; then ARGS="$ARGS --essai"; fi
          python collecte.py $ARGS
      - name: Vérifier que le site se génère
        run: python build.py
      - name: Proposer les nouveaux passages
        id: cpr
        if: ${{ inputs.essai != true }}
        uses: peter-evans/create-pull-request@v7
        with:
          branch: collecte
          delete-branch: true
          title: "Nouveaux passages à valider"
          body-path: resume.md
          commit-message: "Collecte automatique des invités"
          add-paths: |
            data/
      - name: Prévenir Etienne quand une nouvelle proposition est ouverte
        if: ${{ steps.cpr.outputs.pull-request-operation == 'created' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment ${{ steps.cpr.outputs.pull-request-number }} --repo ${{ github.repository }} --body "@EtienneDeGe nouveaux passages à valider."
