name: Aperçus de photos (outil)
on:
  workflow_dispatch:
    inputs:
      fichiers:
        description: "Noms de fichiers Commons séparés par |"
        required: true
permissions:
  contents: write
jobs:
  apercus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          IFS='|' read -ra F <<< "${{ inputs.fichiers }}"
          python3 outils/telecharger_photos.py "${F[@]}"
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outils/apercus && git commit -m "Aperçus de photos" && git push
