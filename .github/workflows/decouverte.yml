name: Repérage des flux (outil)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  reperage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python outils/decouverte_rf.py franceinter/podcasts/questions-politiques franceinter/podcasts/l-invite-du-18h franceinter/podcasts/le-18-20 franceinfo/podcasts/l-invite-franceinfo-soir franceinfo/podcasts/l-invite-de-franceinfo-soir franceinfo/podcasts/les-informes-de-franceinfo franceinfo/podcasts/le-grand-entretien franceinter/podcasts/l-invite-de-13h
