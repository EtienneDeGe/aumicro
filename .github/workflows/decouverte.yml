name: Repérage des flux (outil)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  reperage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python outils/decouverte_rf.py franceculture/podcasts/l-invite-e-des-matins franceculture/podcasts/l-invite-des-matins franceinter/podcasts/franc-jeu franceinter/podcasts/questions-politiques franceinfo/podcasts/l-invite-franceinfo-soir franceinfo/podcasts/l-invite-de-franceinfo-soir franceinfo/podcasts/le-grand-entretien-du-dimanche
